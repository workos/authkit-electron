name: Socket Tier 1 Reachability Analysis

on:
  schedule:
    # every day at 12 AM
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Manually run vulnerability analysis'
      distinct_id:
        description: 'Required by the return-dispatch action'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  socket-vulnerability-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check distinct_id
        env:
          DISTINCT_ID: ${{ github.event.inputs.distinct_id }}
        run: |
          echo "distinct_id: $DISTINCT_ID"
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Route the Socket CLI global install through the WorkOS Socket Firewall.
      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
      - name: Install Socket CLI
        # Pinned so a compromised release can't run arbitrary code next to
        # SOCKET_SECURITY_API_TOKEN; bump deliberately.
        run: npm install -g socket@1.1.145
      # Restore public registry access before the scan runs; no dependency
      # download occurs after this step.
      - name: Restore public package registry
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
      - name: Run Tier 1 reachability scan
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_API_KEY }}
        run: |
          # Full application reachability (Tier 1)
          socket scan create . \
            --reach \
            --org "workos" \
            --no-interactive
