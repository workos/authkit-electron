name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GITHUB_TOKEN (the workos/cli pattern) instead of the workos-sdk-automation
      # app token: the app isn't installed on this repo. CI runs on the release PR
      # are created in an "action_required" state — click "Approve and run" on the
      # release PR before merging. Revert to the app token for zero-click CI once
      # the app installation covers this repo.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    # Pass the named public Socket Firewall secret explicitly. Never use
    # secrets: inherit for a reusable workflow.
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
