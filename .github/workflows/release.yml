name: Release

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        description: >-
          Socket Firewall auth token for public npm-compatible dependency
          downloads. Callers must pass this secret explicitly; never inherit.
        required: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Route dependency downloads through the WorkOS Socket Firewall. This runs
      # after the registry-mutating setup-node above and before the first
      # dependency download, and stays active through `pnpm install`.
      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install Dependencies
        run: pnpm install

      # Remove only SFW-owned npm/DNS configuration and restore public registry
      # access before build, credentials, and publication. No dependency
      # download occurs after this step (`pnpm run build` is offline tsc).
      - name: Restore public package registry
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1

      - name: Build project
        run: pnpm run build

      - name: Publish
        run: pnpm publish --tag latest --access=public --provenance --no-git-checks
